readme = "README.md"
authors = [
    { name = "32120", email = "3212053811@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.162.2",
    "grandalf>=0.8",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
